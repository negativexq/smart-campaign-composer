name: smart-campaign-composer

x-backend: &backend
  image: smart-campaign-composer-backend
  build: .
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DATABASE_URL: postgres://scc:scc@postgres:5432/scc?sslmode=disable
    REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scc
      POSTGRES_PASSWORD: scc
      POSTGRES_DB: scc
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scc -d scc"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  setup:
    <<: *backend
    restart: "no"
    command: ["/app/setup"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["/app/api"]
    environment:
      <<: *backend-env
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-local-unsubscribe-secret}
      WORKER_HEALTH_URL: http://worker:8080/healthz
      PROVIDER_HEALTH_URL: http://mock-provider:8080/healthz
      PROVIDER_WEBHOOK_SECRET: ${PROVIDER_WEBHOOK_SECRET:-local-mock-webhook-secret}
    ports:
      - "8081:8080"
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    command: ["/app/worker"]
    # Longer than delivery.MaxDrain, so a stop never kills a message being recorded.
    stop_grace_period: 30s
    environment:
      <<: *backend-env
      PROVIDER_URL: http://mock-provider:8080
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-local-unsubscribe-secret}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    ports:
      - "8082:8080"
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  mock-provider:
    <<: *backend
    command: ["/app/mock-provider"]
    environment:
      <<: *backend-env
      PROVIDER_EVENTS_URL: http://api:8080/api/provider/events
      PROVIDER_WEBHOOK_SECRET: ${PROVIDER_WEBHOOK_SECRET:-local-mock-webhook-secret}
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
