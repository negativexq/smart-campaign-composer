server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A variable makes nginx look the address up at request time, through Docker's
    # DNS. A fixed name is resolved once at startup, so recreating the API alone
    # would leave every request going to its old address.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api http://api:8080;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Server-sent events must reach the browser as they are produced.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location = /readyz {
        proxy_pass $api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
