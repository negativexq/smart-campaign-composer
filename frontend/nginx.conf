server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A variable makes nginx look the address up at request time, through Docker's
    # DNS. A fixed name is resolved once at startup, so recreating the API alone
    # would leave every request going to its old address.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api http://api:8080;

    # Server-sent events stay out of this list, so they are never held back to compress.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite puts a content hash in these names, so a new build gets new addresses.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every route ends here, and it has to be checked to find a new build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass $api;
        # Slightly above the API's own limit, which gives the clearer message.
        client_max_body_size 6m;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Server-sent events must reach the browser as they are produced.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location = /readyz {
        proxy_pass $api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
